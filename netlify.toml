# MASAJIDALLOH PRO — Netlify Free staging.
# Use Netlify's native Next.js runtime. Do not add SPA redirects or a static export.
[build]
  command = "node scripts/netlify-build.mjs"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"

# Manifest must have a recognized MIME type for browser PWA installation.
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"
    Cache-Control = "public, max-age=300"
