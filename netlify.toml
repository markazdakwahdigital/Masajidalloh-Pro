# MASAJIDALLOH PRO — Netlify Free staging.
# Use Netlify's native Next.js runtime. Do not add SPA redirects or a static export.
[build]
  command = "node scripts/check-deploy-env.mjs && npm run db:generate && npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
