# Netlify automatically provisions the Next.js runtime for supported Next.js releases.
# Do not add a SPA /* /index.html redirect: it would break authenticated server routes.
[build]
  command = "npm run db:generate && npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

# HTTPS and standard security headers for the public-facing app.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
