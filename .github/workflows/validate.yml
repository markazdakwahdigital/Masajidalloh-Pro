name: Validate foundation
on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/phase1-saas-foundation]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
      - name: Verify Netlify-compatible Prisma Query Engine
        shell: bash
        run: |
          set -euo pipefail
          test -s node_modules/.prisma/client/libquery_engine-rhel-openssl-3.0.x.so.node || { echo "::error::Prisma RHEL OpenSSL 3 engine missing; Netlify login would fail with HTTP 502."; exit 1; }
          echo "Prisma engine for Netlify rhel-openssl-3.0.x is bundled."
      - name: Validate Prisma schema
        run: npx prisma validate
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
      - name: Authorization unit tests
        run: node --experimental-strip-types --test tests/*.test.mjs
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
