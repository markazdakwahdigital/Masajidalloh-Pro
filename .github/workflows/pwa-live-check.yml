name: Verify live PWA access
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pwa-live-check.yml'
permissions:
  contents: read
jobs:
  pwa-live-check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/phase1-saas-foundation
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check production PWA endpoints (no secrets)
        env:
          MDD_SITE_ORIGIN: https://masajidallohpro.netlify.app
        run: node scripts/check-pwa-live.mjs
