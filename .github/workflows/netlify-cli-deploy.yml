name: Deploy Netlify via GitHub runner

# A single push to this workflow file also starts deployment; other code pushes do not.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/netlify-cli-deploy.yml'

permissions:
  contents: read

concurrency:
  group: masajidalloh-staging-netlify
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/phase1-saas-foundation
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Netlify token availability (without printing it)
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        shell: bash
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ]; then
            echo "::error::NETLIFY_AUTH_TOKEN belum disimpan dalam GitHub Actions repository secrets."
            exit 1
          fi
      - name: Resolve Netlify site UUID securely
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: node scripts/resolve-netlify-site.mjs
      - name: Check private database secret without revealing values
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        shell: bash
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::GitHub Actions memerlukan repository secret DATABASE_URL. Publishable key adalah nilai publik yang disinkronkan dari Supabase."
            exit 1
          fi
      - name: Validate actual production secret formats before installing dependencies
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://vsbvyhghggvzoanozvvw.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_qYK3MOJFtJ1imHmetvv3Qg_8EqieMxT
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/check-deploy-env.mjs
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate Prisma client
        run: npm run db:generate
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
      - name: Validate Prisma schema
        run: npx prisma validate
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
      - name: Run unit tests
        run: node --experimental-strip-types --test tests/*.test.mjs
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Deploy Next.js with Netlify CLI
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NEXT_PUBLIC_SUPABASE_URL: https://vsbvyhghggvzoanozvvw.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_qYK3MOJFtJ1imHmetvv3Qg_8EqieMxT
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CI: "true"
        # Do not use --dir .next --no-build: Next.js needs Netlify's runtime-generated functions.
        # Netlify sensitive environment variables are not necessarily available outside Netlify's build environment.
        # GitHub Secrets supply them only to this trusted manual deployment job.
        # CLI builds on GitHub runner and uploads runtime output to the existing Netlify project.
        run: npx --yes netlify-cli@latest deploy --prod --site "$NETLIFY_SITE_ID" --context production
