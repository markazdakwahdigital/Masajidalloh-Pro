name: Cloudflare migration compatibility audit
on:
  push:
    branches: [feature/cloudflare-gas-pilot]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compatibility:
    name: vinext static compatibility check (no deployment)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install project dependencies
        run: npm install --no-audit --no-fund
      - name: Generate Rust-free Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
      - name: Verify Prisma Rust-free client
        run: |
          grep -Eq 'engineType[[:space:]]*=[[:space:]]*"client"' prisma/schema.prisma
          test ! -e node_modules/.prisma/client/libquery_engine-rhel-openssl-3.0.x.so.node
      - name: Run vinext compatibility scan
        id: vinext
        continue-on-error: true
        run: |
          set -o pipefail
          npx --yes vinext check 2>&1 | tee vinext-check.log
      - name: Install isolated vinext build tools
        run: npm install --no-save --no-audit --no-fund vinext vite @vitejs/plugin-react @vitejs/plugin-rsc react-server-dom-webpack @cloudflare/vite-plugin wrangler
      - name: Attempt vinext production bundle (no publish)
        id: vinext_build
        run: |
          set -o pipefail
          DATABASE_URL=postgresql://test:test@localhost:5432/test npx vite build 2>&1 | tee vinext-build.log
      - name: Check Worker upload bundle without deployment
        run: npx wrangler deploy --dry-run --outdir ./worker-dryrun
      - name: Inspect Worker build output and reject empty deployment
        shell: bash
        run: |
          echo 'Generated Worker deployment config:'
          node -e 'const c=require("./dist/client/wrangler.json");console.log(JSON.stringify({name:c.name,main:c.main,assets:c.assets,compatibility_date:c.compatibility_date,compatibility_flags:c.compatibility_flags},null,2))'
          echo 'Largest Worker dry-run files:'
          find worker-dryrun -type f -printf '%s %p\n' | sort -nr | head -n 12
          # A tiny asset-only Worker cannot serve authenticated server routes.
          size=$(find worker-dryrun -type f \( -name '*.js' -o -name '*.mjs' \) -printf '%s\n' | awk '{sum+=$1} END {print sum+0}')
          echo "Bundled JS bytes: $size"
          if [ "$size" -lt 4096 ]; then
            echo "::error::Cloudflare deployment bundle is unexpectedly small; SSR and login Worker likely absent. Do not deploy."
            exit 1
          fi
      - name: Publish findings
        if: always()
        shell: bash
        env:
          RESULT: ${{ steps.vinext.outcome }}
          BUILD_RESULT: ${{ steps.vinext_build.outcome }}
        run: |
          {
            echo '## Cloudflare vinext preflight'
            echo 'This workflow does not deploy or use production credentials.'
            echo ''
            echo "Static scan result: **${RESULT}**"
            echo "Build result: **${BUILD_RESULT}**"
            echo ''
            echo 'Check details in the uploaded artifact; scan success does not prove production runtime, Prisma DB connectivity or security.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload compatibility output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vinext-check-report
          path: |
            vinext-check.log
            vinext-build.log
          if-no-files-found: warn
          retention-days: 14
