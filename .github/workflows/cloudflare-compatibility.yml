name: Cloudflare migration compatibility audit
on:
  push:
    branches: [feature/cloudflare-gas-pilot]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compatibility:
    name: vinext static compatibility check (no deployment)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install project dependencies
        run: npm install --no-audit --no-fund
      - name: Generate Rust-free Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
      - name: Verify Prisma Rust-free client
        run: |
          grep -Eq 'engineType[[:space:]]*=[[:space:]]*"client"' prisma/schema.prisma
          test ! -e node_modules/.prisma/client/libquery_engine-rhel-openssl-3.0.x.so.node
      - name: Run vinext compatibility scan
        id: vinext
        continue-on-error: true
        run: |
          set -o pipefail
          npx --yes vinext check 2>&1 | tee vinext-check.log
      - name: Install isolated vinext build tools
        run: npm install --no-save --no-audit --no-fund vinext vite @vitejs/plugin-react @vitejs/plugin-rsc react-server-dom-webpack @cloudflare/vite-plugin wrangler
      - name: Attempt vinext production bundle (no publish)
        id: vinext_build
        run: |
          set -o pipefail
          DATABASE_URL=postgresql://test:test@localhost:5432/test npx vite build 2>&1 | tee vinext-build.log
      - name: Inspect Cloudflare v2 Build Output (no publish)
        shell: bash
        run: |
          echo 'Cloudflare output files:'
          find .cloudflare/output/v0 -type f -printf '%s %p\n' | sort -nr | head -n 18
          test -d .cloudflare/output/v0
          jsbytes=$(find .cloudflare/output/v0 -type f \( -name '*.js' -o -name '*.mjs' \) -printf '%s\n' | awk '{sum+=$1} END {print sum+0}')
          echo "Cloudflare JS output bytes: $jsbytes"
          test "$jsbytes" -ge 4096 || { echo "::error::Cloudflare Worker bundle missing or empty"; exit 1; }
      - name: Publish findings
        if: always()
        shell: bash
        env:
          RESULT: ${{ steps.vinext.outcome }}
          BUILD_RESULT: ${{ steps.vinext_build.outcome }}
        run: |
          {
            echo '## Cloudflare vinext preflight'
            echo 'This workflow does not deploy or use production credentials.'
            echo ''
            echo "Static scan result: **${RESULT}**"
            echo "Build result: **${BUILD_RESULT}**"
            echo ''
            echo 'Check details in the uploaded artifact; scan success does not prove production runtime, Prisma DB connectivity or security.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload compatibility output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vinext-check-report
          path: |
            vinext-check.log
            vinext-build.log
          if-no-files-found: warn
          retention-days: 14
